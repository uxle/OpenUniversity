<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>OpenKnowledge — knowledge is everyone's right</title>
  <meta name="description" content="OpenKnowledge: an open-source, text-first knowledge base. Free lessons, quizzes, translations, and progress tracking.">

  <!-- Open Graph / Social sharing.
       og:image/og:url must be ABSOLUTE — social scrapers (and some chat
       clients) don't resolve relative URLs against the page, so a relative
       og:image silently produced no share card at all. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OpenKnowledge">
  <meta property="og:title" content="OpenKnowledge — knowledge is everyone's right">
  <meta property="og:description" content="Free lessons, quizzes, translations, and progress tracking. No accounts, zero paywalls.">
  <meta property="og:image" content="https://uxle.github.io/OpenUniversity/assets/branding/social-preview.png">
  <meta property="og:url" content="https://uxle.github.io/OpenUniversity/">
  <link rel="canonical" href="https://uxle.github.io/OpenUniversity/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OpenKnowledge">
  <meta name="twitter:description" content="Free public knowledge across core subjects. No accounts, zero paywalls.">
  <meta name="twitter:image" content="https://uxle.github.io/OpenUniversity/assets/branding/social-preview.png">

  <!-- Preload main stylesheet for faster first paint -->
  <link rel="preload" href="src/styles/main.bundle.css" as="style">
  <!-- Preload bootstrap module so the browser fetches it early -->
  <link rel="modulepreload" href="./src/app/bootstrap.js">

  <meta name="theme-color" content="#ffffff" id="theme-color-meta">
  <link rel="icon" type="image/png" sizes="32x32" href="public/icons/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="public/icons/icon-180.png">
  <link rel="manifest" href="public/manifest.json">

  <!-- Icons are inline SVG (src/utils/icons.js) — no icon font, no CDN,
       no flash of missing glyphs, works fully offline. -->

  <!-- src/engines/zolto/zolto-engine.js imports the real, vendored
       `zolto` package (src/engines/zolto/vendor/zolto/) — no bare
       "zolto" specifier, no CDN, no import map needed. -->
  <!-- Single bundled stylesheet (generated by tools/bundle-css.js from
       main.css's @import chain) — one request instead of 28, no water-
       fall. To restyle, edit the files under src/styles/ then run:
         npm run build:css
       (main.css still works standalone for development.) -->
  <link rel="stylesheet" href="src/styles/main.bundle.css">
</head>
<body>
  <div id="app">
    <!-- Fallback shown only if JS fails to load/execute; startApp() replaces this immediately on success. -->
    <noscript>OpenKnowledge needs JavaScript enabled to run.</noscript>
  </div>

  <script type="module">
    import { startApp } from "./src/app/bootstrap.js";
    startApp("#app").catch((err) => {
      console.error("Failed to start OpenKnowledge:", err);
      const msg = err && err.message ? err.message : String(err);
      document.getElementById("app").innerHTML =
        `<div style="
          padding: 2rem;
          text-align: center;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          max-width: 480px;
          margin: 4rem auto;
        ">
          <div style="
            font-size: 2.5rem;
            margin-bottom: 1rem;
          ">⚠️</div>
          <h1 style="
            font-size: 1.375rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #1d1d1f;
          ">Something went wrong</h1>
          <p style="
            color: #6e6e73;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
          ">${msg}</p>
          <p style="
            font-size: 0.8rem;
            color: #a1a1a6;
            margin-bottom: 1.5rem;
          ">Check the browser console for details.<br>
          If you just downloaded/updated the site, try re-extracting fresh.</p>
          <a href="#/" style="
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1.25rem;
            background: #1d1d1f;
            color: #fff;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
            text-decoration: none;
          ">Try again</a>
        </div>`;
    });
  </script>
</body>
</html>
