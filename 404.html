<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page not found — OpenKnowledge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1c1c1e;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: 0;
    }
    a { color: #007aff; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <!-- GitHub Pages serves this file for any URL under the site that
         doesn't map to a real file. The app itself lives at
         /OpenUniversity/ and does all its routing through location.hash,
         so the right move is to send stray deep links back there.
         (A plain href="/" would escape to the user's root site, not the
         project — this file sits at the repo root but is served from a
         project subpath, making relative "./" resolve differently per
         depth. Absolute path is the one form that's correct here.) -->
    <p><a href="/OpenUniversity/">Back to OpenKnowledge</a></p>
    <script>
      // Auto-redirect immediately; the link above remains the no-JS
      // fallback. Preserve any #fragment so shared deep links to
      // #/subjects/... still land where they were headed.
      (function () {
        var target = "/OpenUniversity/" + (location.hash || "");
        location.replace(target);
      })();
    </script>
  </div>
</body>
</html>
